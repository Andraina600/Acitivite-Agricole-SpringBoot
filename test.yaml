  openapi: 3.1.0

  info:
    title: Agricultural federation API
    description: |
      # Versioning
      This API uses semantic versioning (MAJOR.MINOR.PATCH). Available versions are :
      - v0.0.1 (2026-04-21) : POST /collectivities for collectivities creation and POST /members for members creation.
      - v0.0.2 (2026-04-22) : PATCH /collectivities/{id}/identity for assigning a number and a unique name to a collectivity.
    version: 0.0.2

  servers:
    - url: 'http://localhost:8080'

  paths:
    '/collectivities':
      post:
        summary: Create list of collectivities
        description: |
          During collectivity request body creation, only members ID are provided to identify members.
          But the response content includes members information, not only their IDs.
        requestBody:
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CreateCollectivity'
        responses:
          201:
            description: List of created collectivities
            content:
              application/json:
                schema:
                  type: array
                  items:
                    $ref: '#/components/schemas/Collectivity'
          400:
            description: Collectivity without federation approval or structure missing.
            content:
              application/json:
                schema:
                  type: string
          404:
            description: Member not found.
            content:
              application/json:
                schema:
                  type: string

    '/collectivities/{id}/identity':
      patch:
        summary: Assign a number and a unique name to a collectivity
        description: |
          This endpoint allows the federation to assign a unique number and a unique name
          to an existing collectivity. Once a number or a name has been assigned,
          it cannot be changed. The system ensures the uniqueness of the name across
          all collectivities. The number is provided by the federation and must also
          be unique.
        parameters:
          - name: id
            in: path
            required: true
            description: The unique identifier (UUID) of the collectivity to update.
            schema:
              type: string
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectivityIdentity'
        responses:
          200:
            description: Collectivity with its assigned number and name.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Collectivity'
          400:
            description: |
              Bad request in the following cases:
              - The collectivity already has a number or a name assigned (cannot be changed).
              - The provided name already exists in another collectivity.
              - The provided number already exists in another collectivity.
            content:
              application/json:
                schema:
                  type: string
          404:
            description: Collectivity not found.
            content:
              application/json:
                schema:
                  type: string

    '/members':
      post:
        summary: Create list of members
        requestBody:
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CreateMember'
        responses:
          201:
            description: List of created members
            content:
              application/json:
                schema:
                  type: array
                  items:
                    $ref: '#/components/schemas/Member'
          400:
            description: |
              The following case must return a bad request exception :
              - Member with bad referees or without proper payment.
              - Membership dues not paid or registration fee not paid.
            content:
              application/json:
                schema:
                  type: string
          404:
            description: Either collectivity or member not found.
            content:
              application/json:
                schema:
                  type: string

  components:
    schemas:

      CollectivityIdentity:
        type: object
        required:
          - number
          - name
        properties:
          number:
            type: integer
            description: Unique number assigned by the federation to identify the collectivity.
            example: 1
          name:
            type: string
            description: Unique name assigned by the federation to identify the collectivity.
            example: "Collectivité Agricole Analamanga"

      CreateCollectivity:
        type: object
        properties:
          location:
            type: string
          members:
            type: array
            items:
              $ref: '#/components/schemas/MemberIdentifier'
          federationApproval:
            type: boolean
          structure:
            $ref: '#/components/schemas/CreateCollectivityStructure'

      CreateCollectivityStructure:
        type: object
        properties:
          president:
            $ref: '#/components/schemas/MemberIdentifier'
          vicePresident:
            $ref: '#/components/schemas/MemberIdentifier'
          treasurer:
            $ref: '#/components/schemas/MemberIdentifier'
          secretary:
            $ref: '#/components/schemas/MemberIdentifier'

      CollectivityStructure:
        type: object
        properties:
          president:
            $ref: '#/components/schemas/Member'
          vicePresident:
            $ref: '#/components/schemas/Member'
          treasurer:
            $ref: '#/components/schemas/Member'
          secretary:
            $ref: '#/components/schemas/Member'

      Collectivity:
        type: object
        properties:
          id:
            type: string
          number:
            type: integer
            nullable: true
            description: Unique number assigned by the federation. Null until assigned.
          name:
            type: string
            nullable: true
            description: Unique name assigned by the federation. Null until assigned.
          location:
            type: string
          structure:
            $ref: '#/components/schemas/CollectivityStructure'
          members:
            type: array
            items:
              $ref: '#/components/schemas/Member'

      MemberIdentifier:
        type: string

      CreateMember:
        type: object
        allOf:
          - $ref: '#/components/schemas/MemberInformation'
        properties:
          collectivityIdentifier:
            type: string
          referees:
            type: array
            items:
              $ref: '#/components/schemas/MemberIdentifier'
          registrationFeePaid:
            type: boolean
          membershipDuesPaid:
            type: boolean

      MemberInformation:
        type: object
        properties:
          firstName:
            type: string
          lastName:
            type: string
          birthDate:
            type: string
            format: date
          gender:
            $ref: '#/components/schemas/Gender'
          address:
            type: string
          profession:
            type: string
          phoneNumber:
            type: integer
          email:
            type: string
          occupation:
            $ref: '#/components/schemas/MemberOccupation'

      Member:
        type: object
        allOf:
          - $ref: '#/components/schemas/MemberInformation'
        properties:
          id:
            $ref: '#/components/schemas/MemberIdentifier'
          referees:
            type: array
            items:
              $ref: '#/components/schemas/Member'

      Gender:
        type: string
        enum:
          - MALE
          - FEMALE

      MemberOccupation:
        type: string
        enum:
          - JUNIOR
          - SENIOR
          - SECRETARY
          - TREASURER
          - VICE_PRESIDENT
          - PRESIDENT